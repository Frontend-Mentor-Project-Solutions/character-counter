<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="css/styles.css" />

    <title>Frontend Mentor | Character counter</title>
  </head>
  <body>
    <main class="page-layout">
      <header>
        <img
          class="logo"
          src="assets/images/logo-dark-theme.svg"
          alt="Character Counter Logo"
        />

        <button>theme switcher</button>
      </header>

      <h1 class="narrow">Analyze your text in real-time.</h1>

      <section class="input-area">
        <textarea
          aria-label="Enter text to count characters, words, and sentences"
          placeholder="Start typing here... (or past your text)"
        ></textarea>

        <div class="options" role="group" aria-label="Options">
          <label>
            <input type="checkbox" name="exclude-spaces" />
            Exclude Spaces
          </label>

          <label>
            <input type="checkbox" name="character-limit" />
            Set Character Limit
          </label>
        </div>

        <output for="text-input"> Approx. reading time: &lt;1 minute </output>
      </section>

      <section class="switcher">
        <h2 class="visually-hidden">Text Statistics</h2>

        <article>
          <h3>Total Characters</h3>
          <p class="h1">278</p>
        </article>

        <article>
          <h3>Word Count</h3>
          <p class="h1">39</p>
        </article>

        <article>
          <h3>Sentence Count</h3>
          <p class="h1">04</p>
        </article>
      </section>

      <section>
        <h2>Letter Density</h2>

        <p>No characters found. Start typing to see letter density.</p>

        <ol>
          <li>
            <span>E</span>
            <meter value="40" min="0" max="249">40</meter>
            <span>40 (16.06%)</span>
          </li>
          <li>
            <span>I</span>
            <meter value="29" min="0" max="249">29</meter>
            <span>29 (11.65%)</span>
          </li>
          <li>
            <span>T</span>
            <meter value="28" min="0" max="249">28</meter>
            <span>28 (11.24%)</span>
          </li>
        </ol>
      </section>
    </main>
  </body>
</html>
